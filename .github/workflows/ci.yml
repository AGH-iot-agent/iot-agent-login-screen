name: CI

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      project_type:
        required: true
        type: string
      node_version:
        required: true
        type: string
      values_file:
        required: true
        type: string
      chart_type:
        required: true
        type: string
      namespace:
        required: true
        type: string

jobs:
  pipeline:
    uses: AGH-iot-agent/common-pipeline/.github/workflows/common-pipeline.yml@feat/IOTAG-01-common-pipeline
    secrets: inherit
    with:
      service_name: iot-agent-login-screen
      project_type: node
      node_version: "20"
      values_file: ${{ github.event_name == 'pull_request' && 'Helm/values-sbx.yaml' || 'Helm/values-dev.yaml' }}
      chart_type: deployment
      namespace: ${{ github.event_name == 'pull_request' && 'iotag-sbx' || 'iotag-dev' }}
